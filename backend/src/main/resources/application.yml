spring:
  application:
    name: itsm-platform
  config:
    import: optional:application-local.yml
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/itsm_platform}
    username: ${DB_USERNAME:itsm}
    password: ${DB_PASSWORD:itsm}
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    baseline-on-migrate: ${FLYWAY_BASELINE_ON_MIGRATE:false}
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SMTP_AUTH:true}
          starttls:
            enable: ${SMTP_STARTTLS:true}

server:
  port: ${SERVER_PORT:8080}

app:
  n0:
    ai:
      provider: ${N0_AI_PROVIDER:gemini}
      enabled: ${N0_AI_ENABLED:false}
      api-key: ${GEMINI_API_KEY:}
      base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}
      generation-model: ${GEMINI_GENERATION_MODEL:gemini-3.5-flash}
      embedding-model: ${GEMINI_EMBEDDING_MODEL:gemini-embedding-2}
      embedding-dimension: ${GEMINI_EMBEDDING_DIMENSION:768}
      max-output-tokens: ${GEMINI_MAX_OUTPUT_TOKENS:700}
      temperature: ${GEMINI_TEMPERATURE:0.2}
      vector-search-limit: ${N0_VECTOR_SEARCH_LIMIT:5}
  mail:
    from: ${MAIL_FROM:support-it@company.local}
    frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:4200}
  security:
    jwt:
      issuer: ${JWT_ISSUER:itsm-platform}
      secret: ${JWT_SECRET:}
      expiration-minutes: ${JWT_EXPIRATION_MINUTES:15}
      refresh-expiration-days: ${JWT_REFRESH_EXPIRATION_DAYS:7}
    onboarding:
      email-verification-expiration-hours: ${EMAIL_VERIFICATION_EXPIRATION_HOURS:24}
      invitation-expiration-hours: ${INVITATION_EXPIRATION_HOURS:72}
      password-reset-expiration-minutes: ${PASSWORD_RESET_EXPIRATION_MINUTES:30}
