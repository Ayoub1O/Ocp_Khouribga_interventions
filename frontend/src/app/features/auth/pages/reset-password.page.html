<div class="login-page">
  <div class="login-card">
    <div class="login-card-overlay">
      <h1>Nouveau mot de passe</h1>
      <p class="subtitle">Choisissez un mot de passe fort pour proteger votre compte.</p>

      <form (ngSubmit)="submit(form)" #form="ngForm">
        <div class="form-group">
          <label for="newPassword">Nouveau mot de passe</label>
          <div class="input-wrapper">
            <input id="newPassword" name="newPassword" type="password" [(ngModel)]="newPassword" required minlength="12" />
          </div>
        </div>

        <div class="form-group">
          <label for="confirmPassword">Confirmer</label>
          <div class="input-wrapper">
            <input id="confirmPassword" name="confirmPassword" type="password" [(ngModel)]="confirmPassword" required />
          </div>
        </div>

        @if (message()) {
          <div class="success-message">{{ message() }}</div>
        }
        @if (error()) {
          <div class="error-message">{{ error() }}</div>
        }

        <button type="submit" class="login-btn" [disabled]="form.invalid || loading() || !token">
          {{ loading() ? 'Mise a jour...' : 'Reinitialiser' }}
        </button>

        <a routerLink="/login" class="signup-btn">Retour connexion</a>
      </form>
    </div>
  </div>
</div>
