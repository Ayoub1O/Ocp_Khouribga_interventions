<div class="login-page">
  <div class="login-card">
    <div class="login-card-overlay">
      <h1>Mot de passe oublie</h1>
      <p class="subtitle">Entrez votre email. Si le compte existe, un lien securise sera envoye.</p>

      <form (ngSubmit)="submit(form)" #form="ngForm">
        <div class="form-group">
          <label for="email">Email</label>
          <div class="input-wrapper">
            <input id="email" name="email" type="email" [(ngModel)]="email" required />
          </div>
        </div>

        @if (message()) {
          <div class="success-message">{{ message() }}</div>
        }
        @if (error()) {
          <div class="error-message">{{ error() }}</div>
        }

        <button type="submit" class="login-btn" [disabled]="form.invalid || loading()">
          {{ loading() ? 'Envoi...' : 'Envoyer le lien' }}
        </button>

        <a routerLink="/login" class="signup-btn">Retour connexion</a>
      </form>
    </div>
  </div>
</div>
